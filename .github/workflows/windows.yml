name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Match the VS 2022 presets rather than relying on a moving VS version.
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        architecture: [msvc-x64, msvc-x86]
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema test dependency
        run: python -m pip install -r tests/requirements.txt
      - name: Configure
        run: cmake --preset ${{ matrix.architecture }}
      - name: Build
        run: cmake --build --preset ${{ matrix.architecture }}-${{ matrix.configuration }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.architecture }}-${{ matrix.configuration }}
      - uses: actions/setup-node@v4
        if: matrix.configuration == 'release'
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: |
            integrations/mcp/package-lock.json
            integrations/installer/package-lock.json
      - name: Install MCP dependencies
        if: matrix.architecture == 'msvc-x64' && matrix.configuration == 'release'
        working-directory: integrations/mcp
        run: npm ci --no-audit --no-fund
      - name: Build MCP adapter
        if: matrix.architecture == 'msvc-x64' && matrix.configuration == 'release'
        working-directory: integrations/mcp
        run: npm run build
      - name: Test MCP protocol and native integration
        if: matrix.architecture == 'msvc-x64' && matrix.configuration == 'release'
        working-directory: integrations/mcp
        run: npm test
      - name: Test MCP host validation fixtures
        if: matrix.architecture == 'msvc-x64' && matrix.configuration == 'release'
        run: python tests/mcp_hosts_tests.py
      - name: Test Pi package build and archive
        if: matrix.architecture == 'msvc-x64' && matrix.configuration == 'release'
        working-directory: integrations/pi
        run: npm test
      - name: Install installer dependencies
        if: matrix.architecture == 'msvc-x64' && matrix.configuration == 'release'
        working-directory: integrations/installer
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test local Skill and MCP installer
        if: matrix.architecture == 'msvc-x64' && matrix.configuration == 'release'
        working-directory: integrations/installer
        run: |
          $env:DLL_INSTALLER_TEST_CLI = (Resolve-Path ../../build/msvc-x64/Release/cli/dllinjector.exe).Path
          $env:DLL_INSTALLER_TEST_MCP = (Resolve-Path ../mcp/dist/index.js).Path
          npm test
      - name: Test CLI distribution packaging
        if: matrix.configuration == 'release'
        run: |
          $bundleArch = '${{ matrix.architecture }}'.Replace('msvc-', '')
          python tests/cli_distribution_tests.py --cli build/${{ matrix.architecture }}/Release/cli/dllinjector.exe --architecture $bundleArch
      - name: Package CLI distribution
        if: matrix.configuration == 'release'
        run: |
          $bundleArch = '${{ matrix.architecture }}'.Replace('msvc-', '')
          python integrations/installer/scripts/package_cli.py --cli build/${{ matrix.architecture }}/Release/cli/dllinjector.exe --architecture $bundleArch --revision '${{ github.sha }}' --output build/distribution/${{ matrix.architecture }}
      - name: Upload CLI distribution
        if: success() && matrix.configuration == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: cli-distribution-${{ matrix.architecture }}
          if-no-files-found: error
          path: |
            build/distribution/${{ matrix.architecture }}/*.zip
            build/distribution/${{ matrix.architecture }}/*.zip.sha256
      - name: Upload review artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}-${{ matrix.configuration }}
          if-no-files-found: error
          path: |
            build/${{ matrix.architecture }}/${{ matrix.configuration }}/DLLInjector.exe
            build/${{ matrix.architecture }}/${{ matrix.configuration }}/cli/dllinjector.exe
            build/${{ matrix.architecture }}/${{ matrix.configuration }}/demo_target.exe
            build/${{ matrix.architecture }}/${{ matrix.configuration }}/demo_dll.dll
            docs/BASELINE.md
            docs/THIRD_PARTY_NOTICES.md
            docs/P1_CONTRACT.md
            docs/MODULES_CONTRACT.md
            docs/PE_CONTRACT.md
            docs/PE_TABLES_CONTRACT.md
            docs/DOCTOR_CONTRACT.md
            docs/DEPENDENCIES_CONTRACT.md
            docs/REPORTS_CONTRACT.md
            docs/SAVED_REPORTS_CONTRACT.md
            docs/AGENT_COMPATIBILITY.md
            docs/SKILL_CONTRACT.md
            docs/SKILL_DELIVERY.md
            integrations/skills/windows-dll-doctor/
            schemas/cli-v1.json
            schemas/cli-v1.1.json
            schemas/cli-v1.2.json
            schemas/cli-v1.3.json
            schemas/cli-v1.4.json
            schemas/cli-v1.5.json
            schemas/cli-v1.6.json
      - name: Upload cross-bitness fixtures
        if: success() && matrix.configuration == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: module-fixtures-${{ matrix.architecture }}
          if-no-files-found: error
          path: |
            build/${{ matrix.architecture }}/Release/cli/dllinjector.exe
            build/${{ matrix.architecture }}/Release/module_host.exe
            build/${{ matrix.architecture }}/Release/noop_fixture.dll
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.architecture }}-${{ matrix.configuration }}
          if-no-files-found: ignore
          path: build/${{ matrix.architecture }}/Testing/Temporary/LastTest.log

  cross-bitness:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema test dependency
        run: python -m pip install -r tests/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: module-fixtures-msvc-x64
          path: build/cross/x64
      - uses: actions/download-artifact@v4
        with:
          name: module-fixtures-msvc-x86
          path: build/cross/x86
      - name: x64 caller enumerates x86 host
        run: python tests/modules_contract.py build/cross/x86/cli/dllinjector.exe build/cross/x86/module_host.exe build/cross/x86/noop_fixture.dll . build/cross/x64/cli/dllinjector.exe 0
      - name: x86 caller rejects x64 host
        run: python tests/modules_contract.py build/cross/x64/cli/dllinjector.exe build/cross/x64/module_host.exe build/cross/x64/noop_fixture.dll . build/cross/x86/cli/dllinjector.exe 4
